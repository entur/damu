apiVersion: v1
data:
  application.properties: |+

    # Spring
    spring.profiles.active=gcs-blobstore
    server.port={{ .Values.common.service.internalPort }}

    # Damu
    # Refresh stop place cache at 01:00 and 14:00 every day.
    # Spring cron: second minute hour day-of-month month day-of-week. Unquoted on purpose: this renders
    # into a properties file, where quotes would become part of the value and the cron parser would
    # reject it at startup.
    damu.netex.stop.cache.refresh.cron=0 0 1,14 * * *
    # Export the stop places to GTFS at 03:30 every day
    damu.netex.stop.export.cron=0 30 3 * * *
    damu.netex.stop.full.filename=tiamat/CurrentAndFuture_latest.zip
    damu.gtfs.export.folder={{ .Values.gcp.marduk.gtfsFolder }}
    damu.gtfs.export.transfer.stayseated={{ .Values.damu.gtfs.export.stayseated }}
    gtfs.export.download.directory=/tmp/damu/files/gtfs/merged
    stopplace.registry.url={{ .Values.stopplaceRegistryUrl }}
    # Two @Scheduled methods, the stop place cache refresh and the stop GTFS export. Both do blocking
    # network work and the schedules are close enough to coincide after a slow run.
    spring.task.scheduling.pool.size=2

    # PubSub
    damu.pubsub.project.id={{ .Values.gcp.pubsubProjectId }}
    spring.cloud.gcp.project-id=${damu.pubsub.project.id}
    # One request at a time, which is what the Camel consumer's synchronousPull with the default
    # maxMessagesPerPoll=1 gave. The client defaults are 4 threads and 1000 outstanding messages, and an
    # export or an aggregation is expensive enough in heap and disk that several at once is a real risk.
    spring.cloud.gcp.pubsub.subscriber.executor-threads=1
    spring.cloud.gcp.pubsub.subscriber.flow-control.max-outstanding-element-count=1
    # The publisher's thread pool stops accepting work on ContextClosedEvent by default. That event also
    # stops the subscribers, but a job already running keeps going, so without this it finishes and then
    # cannot tell marduk how it went.
    spring.cloud.gcp.pubsub.publisher.executor-accept-tasks-after-context-close=true
    # Topics and subscriptions are terraformed, so the pods must not try to create them.
    entur.pubsub.subscriber.autocreate=false
    # Slept inline on the callback thread after a nack, and with one consumer thread that is how long the
    # pod stops working. The subscription's own retry_policy.minimum_backoff already spaces redeliveries.
    entur.pubsub.consumer.retry.delay=1000
    # A subscriber that fails on a non-retryable status never restarts. Break liveness so
    # the pod is replaced; the ERROR line alone would leave it running and consuming nothing.
    entur.pubsub.consumer.break-liveness-on-terminal-failure=true

    # Blobstore
    blobstore.gcs.project.id={{ .Values.gcp.blobstoreProjectId }}
    blobstore.gcs.marduk.container.name={{ .Values.gcp.marduk.bucketName }}
    blobstore.gcs.damu.container.name={{ .Values.gcp.damu.bucketName }}

    # Actuator
    management.server.port={{ .Values.common.service.internalPort }}
    management.endpoints.access.default=none
    management.endpoint.info.access=unrestricted
    management.endpoint.health.access=unrestricted
    management.endpoint.health.group.readiness.include=readinessState
    management.endpoint.prometheus.access=unrestricted
    management.endpoints.web.exposure.include=info,health,prometheus
    management.health.pubsub.enabled=false

    # Logging
    logging.config=classpath:logback.xml
    logging.level.no.entur=INFO
    logging.level.no.entur.damu=INFO
    # gtfs-validator 8 logs its "validators skipped because the data is absent" table at WARN. Flogger
    # gives the whole class one level, so this also drops the INFO lines from ValidationRunner.
    logging.level.org.mobilitydata.gtfsvalidator.runner.ValidationRunner=ERROR


kind: ConfigMap
metadata:
  name: damu-application
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "damu.common.labels" . | indent 4 }}
  annotations:
  {{- include "damu.common.annotations" . | indent 4 }}
