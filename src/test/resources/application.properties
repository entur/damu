# Spring boot
server.port=28080

# Blob store
# The aggregation working directory. A failed aggregation deliberately does not clean up after itself,
# so this must not default to a relative path inside the working copy.
gtfs.export.download.directory=target/gtfs/merged
blobstore.gcs.marduk.container.name=marduk
blobstore.gcs.damu.container.name=damu
blobstore.local.folder=target/blobstore
blobstore.gcs.project.id=test

# PubSub
# The jobs are driven directly by the tests; nothing subscribes. PubSubWiringTest turns this back on.
damu.pubsub.consumers.enabled=false
damu.pubsub.project.id=test
logging.level.io.grpc.internal.ManagedChannelOrphanWrapper=OFF

spring.cloud.gcp.project-id=${damu.pubsub.project.id}
# An emulator host, even an unreachable one, is what makes Spring Cloud GCP skip credential lookup.
# Nothing connects: the tests replace the publisher and disable the consumers.
spring.cloud.gcp.pubsub.emulator-host=localhost:8085

# Real crons, so that booting any test parses them the way production does. @Scheduled parses eagerly,
# so an unparseable value fails the context here instead of failing a deploy. Both are far enough away
# that they cannot fire during a build.
damu.netex.stop.cache.refresh.cron=0 0 1,14 * * *
damu.netex.stop.export.cron=0 30 3 * * *

# Non-default on purpose: SchedulingConfigTest asserts this reaches the scheduler @Scheduled uses.
# At the default of 1 that assertion cannot fail.
spring.task.scheduling.pool.size=2

# Monitoring
management.endpoints.access.default=none
management.health.pubsub.enabled=false
management.endpoints.web.exposure.exclude=*
management.endpoints.jmx.exposure.exclude=*
