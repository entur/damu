publiccodeYmlVersion: "0.7.0"

name: Damu
url: https://github.com/entur/damu

platforms:
  - web
  - linux

categories:
  - data-collection
  - geographic-information-systems

developmentStatus: stable
softwareType: standalone/backend

organisation:
  name: Entur AS
  uri: https://entur.no

usedBy:
  - Norway (nationwide), Entur AS

intendedAudience:
  scope:
    - transportation
  countries:
    - "NO"

description:
  en:
    localisedName: Damu
    shortDescription: Converts NeTEx datasets to GTFS.
    longDescription: >
      Damu downloads exported NeTEx datasets from cloud storage, converts them with the netex-gtfs-converter-java
      library, uploads the GTFS archive and notifies the pipeline. Triggered by PubSub when a NeTEx export
      completes.
    documentation: https://github.com/entur/damu/blob/master/README.md
    features:
      - NeTEx to GTFS conversion
      - Event-driven, triggered by completed NeTEx exports
      - Built on netex-gtfs-converter-java

